<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Конструктор космического корабля</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- СТАТЫ КОРАБЛЯ -->
    <div id="ship-stats">
        <h2>🚀 КОРАБЛЬ</h2>
        <div id="stats-content">
            <div class="stat"><span>⚡ Скорость</span><span id="stat-speed">0</span></div>
            <div class="stat"><span>🛡️ Броня</span><span id="stat-armor">0</span></div>
            <div class="stat"><span>💥 Урон</span><span id="stat-damage">0</span></div>
            <div class="stat"><span>📦 Груз</span><span id="stat-cargo">0</span></div>
            <div class="stat"><span>⛽ Топливо</span><span id="stat-fuel">0</span></div>
        </div>
        <div id="parts-count">Деталей: 0/0</div>
        <div id="ready-status" class="not-ready">❌ Нет кабины</div>
        
        <!-- ВЫБОР ЧЕРТЕЖА -->
        <div style="margin-top:12px;border-top:1px solid rgba(255,255,255,0.1);padding-top:8px;">
            <label style="font-size:12px;color:#888;">Чертёж:</label>
            <select id="ship-select" style="width:100%;margin-top:4px;padding:6px;background:#111;color:#fff;border:1px solid #333;border-radius:4px;"></select>
        </div>
    </div>
    
    <!-- СЛОТЫ КОРАБЛЯ -->
    <div id="slots-panel">
        <h3>🔧 Слоты корабля</h3>
        <div id="slots-list"></div>
    </div>
    
    <!-- ПАНЕЛЬ ДЕТАЛЕЙ -->
    <div id="parts-panel">
        <div id="categories"></div>
        <div id="parts-list"></div>
    </div>
    
    <!-- КНОПКИ -->
    <div id="action-buttons">
        <button id="btn-random">🎲 Случайно</button>
        <button id="btn-clear">🧹 Очистить</button>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
