<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок 2: Управление камерой</title>      
</head>
<body>    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // ============================================
        // 1. СОЗДАЁМ СЦЕНУ, КАМЕРУ, РЕНДЕРЕР
        // ============================================
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222244);
        
        // Перспективная камера — имитирует человеческое зрение
        // Параметры: угол обзора, соотношение сторон, ближняя граница, дальняя граница
        const camera = new THREE.PerspectiveCamera(
            75,                                    // градусов — ширина обзора
            window.innerWidth / window.innerHeight, // чтобы не искажалось при ресайзе
            0.1,                                   // не рисуем ближе 10 см
            1000                                   // не рисуем дальше 1 км
        );
        camera.position.set(5, 4, 5);              // камера сверху-сбоку
        camera.lookAt(0, 0, 0);                    // смотрит в центр сцены
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // ============================================
        // 2. ОРБИТАЛЬНОЕ УПРАВЛЕНИЕ
        // ============================================
        
        // OrbitControls сами обрабатывают мышь и двигают камеру
        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.enableDamping = true;         // плавное затухание (как инерция)
        orbitControls.dampingFactor = 0.08;         // 0 = без инерции, 1 = бесконечная
        orbitControls.target.set(0, 0, 0);         // точка, вокруг которой вращаемся
        
        // ============================================
        // 3. ОБЪЕКТЫ НА СЦЕНЕ
        // ============================================
        
        // Пол — плоскость, повёрнутая горизонтально
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(12, 12),  // 12×12 метров
            new THREE.MeshStandardMaterial({ color: 0x448844, roughness: 0.9 })
        );
        floor.rotation.x = -Math.PI / 2;  // поворот на -90° вокруг X
        // PlaneGeometry создаётся вертикально (в плоскости XY)
        // Чтобы положить её на землю, поворачиваем вокруг X на -90° → теперь в плоскости XZ
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Сетка-помощник — просто линии на полу для ориентира
        const grid = new THREE.GridHelper(12, 12, 0x666666, 0x333333);
        grid.position.y = 0.01; // чуть выше пола, чтобы не было мерцания
        scene.add(grid);
        
        // Несколько кубов для ориентиров в пространстве
        const cubes = [];
        
        // Красный куб в центре
        const centerCube = new THREE.Mesh(
            new THREE.BoxGeometry(0.8, 0.8, 0.8),
            new THREE.MeshStandardMaterial({ color: 0xff4444 })
        );
        centerCube.position.set(0, 0.4, 0);
        scene.add(centerCube);
        
        // Ещё 5 кубов по кругу
        for (let i = 0; i < 5; i++) {
            const angle = (i / 5) * Math.PI * 2;  // равномерно по кругу
            const radius = 3;
            
            const cube = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 0.5, 0.5),
                new THREE.MeshStandardMaterial({ color: 0x4488ff })
            );
            // Размещаем по кругу:
            // X = радиус × cos(угла)
            // Z = радиус × sin(угла)
            cube.position.set(
                Math.cos(angle) * radius,
                0.25,
                Math.sin(angle) * radius
            );
            scene.add(cube);
            cubes.push(cube);
        }
        
        // ============================================
        // 4. ОСВЕЩЕНИЕ
        // ============================================
        
        // Рассеянный свет — чтобы тени не были абсолютно чёрными
        scene.add(new THREE.AmbientLight(0x404040, 0.6));
        
        // Направленный свет — как солнце, все лучи параллельны
        const sun = new THREE.DirectionalLight(0xffffff, 2);
        sun.position.set(5, 8, 3);
        scene.add(sun);
        
        // ============================================
        // 5. СИСТЕМА ПЕРЕКЛЮЧЕНИЯ РЕЖИМОВ
        // ============================================
        
        let isFirstPerson = false;     // текущий режим
        const keys = {};               // какие клавиши сейчас нажаты
        
        // Запоминаем куда смотреть в орбитальном режиме
        const savedOrbitPos = new THREE.Vector3(5, 4, 5);
        const savedOrbitTarget = new THREE.Vector3(0, 0, 0);
        
        // Отслеживаем нажатия клавиш
        window.addEventListener('keydown', (event) => {
            keys[event.key.toLowerCase()] = true;
            
            // Клавиша F переключает режим
            if (event.key.toLowerCase() === 'f') {
                // event.repeat — защита от автоповтора (когда клавишу зажали)
                if (event.repeat) return;
                
                isFirstPerson = !isFirstPerson;
                
                if (isFirstPerson) {
                    // === ПЕРЕХОД В РЕЖИМ ОТ ПЕРВОГО ЛИЦА ===
                    
                    // 1. Сохраняем где была орбитальная камера (чтобы вернуться потом)
                    savedOrbitPos.copy(camera.position);
                    savedOrbitTarget.copy(orbitControls.target);
                    
                    // 2. Отключаем орбитальное управление (теперь двигаем сами)
                    orbitControls.enabled = false;
                    
                    // 3. Ставим камеру на уровень глаз (1.7 метра)
                    camera.position.set(0, 1.7, 4);
                    
                    // 4. Направляем взгляд вперёд по сцене (на север, по -Z)
                    camera.lookAt(0, 1.7, -5);
                    
                    // 5. Блокируем курсор — мышь теперь не видна и не уходит за край
                    renderer.domElement.requestPointerLock();
                    
                } else {
                    // === ВОЗВРАТ В ОРБИТАЛЬНЫЙ РЕЖИМ ===
                    
                    // 1. Освобождаем курсор
                    document.exitPointerLock();
                    
                    // 2. Возвращаем камеру и точку обзора
                    camera.position.copy(savedOrbitPos);
                    orbitControls.target.copy(savedOrbitTarget);
                    
                    // 3. Включаем орбитальное управление обратно
                    orbitControls.enabled = true;
                    orbitControls.update();
                    
                }
            }
        });
        
        window.addEventListener('keyup', (event) => {
            keys[event.key.toLowerCase()] = false;
        });
        
        // ============================================
        // 6. ДВИЖЕНИЕ В РЕЖИМЕ ОТ ПЕРВОГО ЛИЦА
        // ============================================
        
        // Углы поворота камеры (будем менять их мышью)
        const euler = new THREE.Euler(0, 0, 0, 'YXZ'); // YXZ — порядок поворотов: сначала Y, потом X
        
        // Мышь двигает камеру
        document.addEventListener('mousemove', (event) => {
            // Работает только в FPS-режиме и когда курсор заблокирован
            if (!isFirstPerson) return;
            if (document.pointerLockElement !== renderer.domElement) return;
            
            // event.movementX — на сколько пикселей мышь сдвинулась по горизонтали
            // event.movementY — по вертикали
            // Работает только при заблокированном курсоре (Pointer Lock API)
            
            // Уменьшаем чувствительность умножением на 0.002
            // Горизонталь — вращение вокруг Y (поворот влево-вправо)
            euler.y -= event.movementX * 0.002;
            
            // Вертикаль — вращение вокруг X (взгляд вверх-вниз)
            euler.x -= event.movementY * 0.002;
            
            // Ограничиваем взгляд вверх/вниз чтобы не перевернуться
            // Math.PI / 2.5 ≈ 72° — достаточно чтобы смотреть вниз и вверх, но не задирать голову за спину
            euler.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, euler.x));
            
            // Применяем углы к камере
            camera.quaternion.setFromEuler(euler);
        });
        
        // Функция движения — вызывается каждый кадр
        function moveFirstPerson(deltaTime) {
            // Скорость: 4 единицы в секунду
            // deltaTime — сколько секунд прошло с прошлого кадра (~0.016 при 60 FPS)
            const moveSpeed = 4 * deltaTime;
            
            // Берём стандартное направление "вперёд" для Three.js
            // По умолчанию камера смотрит по -Z, значит вперёд = (0, 0, -1)
            const forward = new THREE.Vector3(0, 0, -1);
            
            // Направление "вправо" = (1, 0, 0)
            const right = new THREE.Vector3(1, 0, 0);
            
            // Поворачиваем эти направления туда, куда реально смотрит камера
            // applyQuaternion берёт вектор и поворачивает его так же, как повёрнута камера
            forward.applyQuaternion(camera.quaternion);
            right.applyQuaternion(camera.quaternion);
            
            // Обнуляем вертикаль — ходим только по горизонтали, не взлетаем
            forward.y = 0;
            right.y = 0;
            
            // Делаем векторы длиной ровно 1 (могли измениться после обнуления Y)
            forward.normalize();
            right.normalize();
            
            // Обрабатываем WASD (и русскую раскладку тоже)
            // addScaledVector — сдвинуть на вектор, умноженный на число
            // camera.position = camera.position + forward * moveSpeed
            if (keys['w'] || keys['ц']) camera.position.addScaledVector(forward, moveSpeed);
            if (keys['s'] || keys['ы']) camera.position.addScaledVector(forward, -moveSpeed);
            if (keys['a'] || keys['ф']) camera.position.addScaledVector(right, -moveSpeed);
            if (keys['d'] || keys['в']) camera.position.addScaledVector(right, moveSpeed);
        }
        
        // ============================================
        // 7. ИГРОВОЙ ЦИКЛ
        // ============================================
        
        const clock = new THREE.Clock(); // часы для измерения времени между кадрами
        
        function animate() {
            // Просим браузер вызвать эту функцию перед следующей отрисовкой
            requestAnimationFrame(animate);
            
            // Сколько секунд прошло с прошлого кадра
            const deltaTime = clock.getDelta();
            
            if (isFirstPerson) {
                // Режим от первого лица — двигаем камеру сами
                moveFirstPerson(deltaTime);
            } else {
                // Орбитальный режим — контролы сами двигают камеру
                orbitControls.update();
            }
            
            // Рисуем кадр
            renderer.render(scene, camera);
        }
        
        // Запускаем
        animate();
        
        // ============================================
        // 8. ОБРАБОТКА РЕСАЙЗА ОКНА
        // ============================================
        
        window.addEventListener('resize', () => {
            // Меняем соотношение сторон камеры под новый размер окна
            camera.aspect = window.innerWidth / window.innerHeight;
            // Сообщаем камере что параметры изменились
            camera.updateProjectionMatrix();
            // Меняем размер холста
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
