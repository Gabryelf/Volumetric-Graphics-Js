<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Урок 2: Управление камерой</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas {
            display: block;
        }
        
        /* Панель инструкций */
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 30px;
            border-radius: 10px;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.5s;
            backdrop-filter: blur(5px);
        }
        
        #instructions.hidden {
            opacity: 0;
        }
        
        #instructions h2 {
            margin-top: 0;
            color: #00ff88;
        }
        
        .key {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-family: monospace;
            margin: 0 2px;
        }
        
        /* Миникарта */
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        #minimap canvas {
            width: 100%;
            height: 100%;
        }
        
        /* Информационная панель */
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        
        .coordinates {
            font-family: monospace;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <!-- Инструкция, которая исчезнет при клике -->
    <div id="instructions">
        <h2>🎮 Управление</h2>
        <p>Режим орбиты (текущий):</p>
        <p>
            <span class="key">🖱️ Левая кнопка</span> - вращать<br>
            <span class="key">🖱️ Колёсико</span> - приблизить<br>
            <span class="key">🖱️ Правая кнопка</span> - панорама
        </p>
        <p style="margin-top: 20px;">
            <span class="key">F</span> - режим от первого лица
        </p>
        <p style="font-size: 12px; color: #aaa;">Кликните для начала</p>
    </div>
    
    <!-- Информационная панель -->
    <div id="info-panel">
        <div>Режим: <span id="mode-display">Орбита</span></div>
        <div>Позиция: <span id="position-display" class="coordinates">0, 0, 0</span></div>
    </div>
    
    <!-- Миникарта -->
    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
    </div>
    
    <!-- Подключаем Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // ============================================
        // ИНИЦИАЛИЗАЦИЯ СЦЕНЫ
        // ============================================
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Небесно-голубой
        scene.fog = new THREE.Fog(0x87CEEB, 10, 50); // Добавляем туман для атмосферы
        
        // Создаём камеру
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(5, 5, 10);
        camera.lookAt(0, 0, 0);
        
        // Создаём рендерер
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);
        
        // ============================================
        // ORBIT CONTROLS (Орбитальное управление)
        // ============================================
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;        // Плавное затухание
        controls.dampingFactor = 0.05;        // Сила затухания
        controls.minDistance = 3;             // Минимальное приближение
        controls.maxDistance = 20;            // Максимальное отдаление
        controls.maxPolarAngle = Math.PI / 2; // Не даём уйти под землю
        controls.target.set(0, 0, 0);         // Точка вращения
        controls.update();
        
        // ============================================
        // СОЗДАНИЕ ИГРОВОГО МИРА
        // ============================================
        
        // Пол
        const floorGeometry = new THREE.PlaneGeometry(20, 20);
        const floorMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x3a7c3a,
            roughness: 0.8,
            metalness: 0.2
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2; // Поворачиваем горизонтально
        floor.position.y = -0.5;
        floor.receiveShadow = true;
        scene.add(floor);
        
        // Сетка для наглядности
        const gridHelper = new THREE.GridHelper(20, 20, 0x000000, 0x444444);
        gridHelper.position.y = -0.49;
        scene.add(gridHelper);
        
        // Центральная башня
        const towerGeometry = new THREE.CylinderGeometry(0.5, 0.7, 3, 8);
        const towerMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x8B7355,
            roughness: 0.6,
            metalness: 0.3
        });
        const tower = new THREE.Mesh(towerGeometry, towerMaterial);
        tower.position.set(0, 1, 0);
        tower.castShadow = true;
        tower.receiveShadow = true;
        scene.add(tower);
        
        // Крыша башни
        const roofGeometry = new THREE.ConeGeometry(0.8, 0.5, 8);
        const roofMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x8B0000,
            roughness: 0.7
        });
        const roof = new THREE.Mesh(roofGeometry, roofMaterial);
        roof.position.set(0, 2.75, 0);
        roof.castShadow = true;
        scene.add(roof);
        
        // Создаём несколько объектов для исследования
        const objects = [];
        const colors = [0xff6b6b, 0x4ecdc4, 0x45b7d1, 0xf9ca24, 0x6ab04c];
        
        for (let i = 0; i < 20; i++) {
            const size = Math.random() * 0.5 + 0.2;
            let geometry;
            const shapeType = Math.floor(Math.random() * 3);
            
            switch(shapeType) {
                case 0:
                    geometry = new THREE.BoxGeometry(size, size, size);
                    break;
                case 1:
                    geometry = new THREE.SphereGeometry(size / 2, 16, 16);
                    break;
                case 2:
                    geometry = new THREE.CylinderGeometry(size / 2, size / 2, size, 8);
                    break;
            }
            
            const material = new THREE.MeshStandardMaterial({
                color: colors[Math.floor(Math.random() * colors.length)],
                roughness: 0.4,
                metalness: 0.6
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            
            // Размещаем в случайных местах, но не слишком близко к центру
            const angle = Math.random() * Math.PI * 2;
            const radius = 3 + Math.random() * 7;
            mesh.position.x = Math.cos(angle) * radius;
            mesh.position.z = Math.sin(angle) * radius;
            mesh.position.y = size / 2;
            
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = {
                rotationSpeed: Math.random() * 0.5 + 0.1,
                floatSpeed: Math.random() * 0.5 + 0.2,
                floatAmplitude: Math.random() * 0.3 + 0.1,
                initialY: mesh.position.y
            };
            
            scene.add(mesh);
            objects.push(mesh);
        }
        
        // ============================================
        // ОСВЕЩЕНИЕ
        // ============================================
        
        // Окружающий свет
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);
        
        // Основной направленный свет (солнце)
        const sunLight = new THREE.DirectionalLight(0xfff0dd, 3);
        sunLight.position.set(10, 15, 5);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 50;
        sunLight.shadow.camera.left = -15;
        sunLight.shadow.camera.right = 15;
        sunLight.shadow.camera.top = 15;
        sunLight.shadow.camera.bottom = -15;
        sunLight.shadow.bias = -0.0001;
        scene.add(sunLight);
        
        // Лёгкий заполняющий свет
        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.5);
        fillLight.position.set(-5, 0, -5);
        scene.add(fillLight);
        
        // ============================================
        // СИСТЕМА УПРАВЛЕНИЯ
        // ============================================
        
        const keys = {};
        let isFirstPerson = false;
        
        // Отслеживание нажатий клавиш
        window.addEventListener('keydown', (event) => {
            keys[event.key.toLowerCase()] = true;
            
            // Переключение режима по клавише F
            if (event.key.toLowerCase() === 'f' && !event.repeat) {
                toggleCameraMode();
            }
        });
        
        window.addEventListener('keyup', (event) => {
            keys[event.key.toLowerCase()] = false;
        });
        
        // Блокировка курсора для режима от первого лица
        renderer.domElement.addEventListener('click', () => {
            if (isFirstPerson) {
                renderer.domElement.requestPointerLock();
            }
        });
        
        // Скрываем инструкции при первом клике
        const instructions = document.getElementById('instructions');
        let instructionsHidden = false;
        
        document.addEventListener('click', () => {
            if (!instructionsHidden) {
                instructions.classList.add('hidden');
                instructionsHidden = true;
            }
        });
        
        // Переключение режимов камеры
        function toggleCameraMode() {
            isFirstPerson = !isFirstPerson;
            
            if (isFirstPerson) {
                // Переход в режим от первого лица
                controls.enabled = false;
                document.getElementById('mode-display').textContent = 'От первого лица';
                
                // Устанавливаем камеру на уровень глаз
                camera.position.set(0, 1.7, 5);
                camera.lookAt(0, 1.7, 0);
                
                // Блокируем курсор
                renderer.domElement.requestPointerLock();
            } else {
                // Возврат в орбитальный режим
                controls.enabled = true;
                document.getElementById('mode-display').textContent = 'Орбита';
                
                // Восстанавливаем позицию камеры
                camera.position.set(5, 5, 10);
                controls.target.set(0, 0, 0);
                controls.update();
                
                // Освобождаем курсор
                document.exitPointerLock();
            }
        }
        
        // Обработка движения мыши в режиме от первого лица
        let mouseSensitivity = 0.002;
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        
        document.addEventListener('mousemove', (event) => {
            if (isFirstPerson && document.pointerLockElement === renderer.domElement) {
                euler.setFromQuaternion(camera.quaternion);
                
                euler.y -= event.movementX * mouseSensitivity;
                euler.x -= event.movementY * mouseSensitivity;
                
                // Ограничиваем взгляд по вертикали
                euler.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, euler.x));
                
                camera.quaternion.setFromEuler(euler);
            }
        });
        
        // Создаём часы для дельта-времени
        const clock = new THREE.Clock();
        
        // ============================================
        // АНИМАЦИОННЫЙ ЦИКЛ
        // ============================================
        
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = Math.min(clock.getDelta(), 0.1); // Ограничиваем для стабильности
            
            // Обновление орбитальных контролов
            if (!isFirstPerson) {
                controls.update();
            } else {
                // Движение от первого лица (WASD)
                handleFirstPersonMovement(deltaTime);
            }
            
            // Анимация объектов
            const time = Date.now() * 0.001;
            objects.forEach(obj => {
                // Вращение
                obj.rotation.y += obj.userData.rotationSpeed * deltaTime;
                
                // Парение вверх-вниз
                obj.position.y = obj.userData.initialY + 
                    Math.sin(time * obj.userData.floatSpeed) * obj.userData.floatAmplitude;
            });
            
            // Медленное вращение башни
            tower.rotation.y += 0.1 * deltaTime;
            roof.rotation.y += 0.1 * deltaTime;
            
            // Обновление информации на экране
            updateInfoPanel();
            
            // Обновление миникарты
            updateMinimap();
            
            // Рендеринг
            renderer.render(scene, camera);
        }
        
        // ============================================
        // ДВИЖЕНИЕ ОТ ПЕРВОГО ЛИЦА
        // ============================================
        
        function handleFirstPersonMovement(deltaTime) {
            const speed = 5; // Базовая скорость движения
            const moveSpeed = speed * deltaTime;
            
            // Получаем направление движения
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            
            // Обнуляем вертикальную составляющую
            forward.y = 0;
            right.y = 0;
            forward.normalize();
            right.normalize();
            
            // WASD движение
            if (keys['w'] || keys['ц']) { // W (английская и русская раскладка)
                camera.position.addScaledVector(forward, moveSpeed);
            }
            if (keys['s'] || keys['ы']) {
                camera.position.addScaledVector(forward, -moveSpeed);
            }
            if (keys['a'] || keys['ф']) {
                camera.position.addScaledVector(right, -moveSpeed);
            }
            if (keys['d'] || keys['в']) {
                camera.position.addScaledVector(right, moveSpeed);
            }
            
            // Бег на Shift
            if (keys['shift']) {
                camera.position.addScaledVector(forward, moveSpeed * 0.5);
            }
            
            // Прыжок на пробел
            if (keys[' '] && camera.position.y <= 1.7) {
                camera.position.y += 5 * deltaTime;
            }
            
            // Гравитация (простая)
            if (camera.position.y > 1.7) {
                camera.position.y -= 5 * deltaTime;
            } else {
                camera.position.y = 1.7; // Уровень земли
            }
            
            // Ограничение перемещения (не выходим за пределы пола)
            const boundary = 9.5;
            camera.position.x = Math.max(-boundary, Math.min(boundary, camera.position.x));
            camera.position.z = Math.max(-boundary, Math.min(boundary, camera.position.z));
        }
        
        // ============================================
        // ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================
        
        function updateInfoPanel() {
            const pos = camera.position;
            document.getElementById('position-display').textContent = 
                `${pos.x.toFixed(1)}, ${pos.y.toFixed(1)}, ${pos.z.toFixed(1)}`;
        }
        
        let minimapCamera, minimapRenderer;
        
        function setupMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            minimapRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            minimapRenderer.setSize(200, 200);
            
            minimapCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
            minimapCamera.position.set(0, 20, 0);
            minimapCamera.lookAt(0, 0, 0);
        }
        
        function updateMinimap() {
            if (!minimapRenderer) {
                setupMinimap();
            }
            
            // Очищаем миникарту
            minimapRenderer.setClearColor(0x000000, 0);
            minimapRenderer.clear();
            
            // Временно меняем фон сцены для миникарты
            const originalBackground = scene.background;
            scene.background = new THREE.Color(0x333333);
            
            // Рендерим миникарту
            minimapRenderer.render(scene, minimapCamera);
            
            // Возвращаем фон
            scene.background = originalBackground;
        }
        
        // ============================================
        // ОБРАБОТКА РЕСАЙЗА
        // ============================================
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // ============================================
        // ЗАПУСК
        // ============================================
        
        animate();
        
        console.log('🎮 Урок 2 запущен!');
        console.log('Управление: мышь для вращения, F для режима от первого лица');
        console.log('В режиме от первого лица: WASD для движения');
    </script>
</body>
</html>
