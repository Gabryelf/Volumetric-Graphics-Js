<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>✦ NEOVERSE | 3D Mastery Portal ✦</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', 'Orbitron', monospace;
            color:rgb(255, 255, 255)
        }
        
        /* Минималистичный UI — только самое необходимое */
        /* UI панель — более тонкая и футуристичная */
        .ui-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            right: 25px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            pointer-events: none;
        }

        .glass-badge {
            backdrop-filter: blur(16px);
            border-radius: 40px;
            border: 1px solid rgba(100, 200, 255, 0.4);
            padding: 8px 24px;
            pointer-events: auto;
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #aaffff, #ff66cc, #ffaa44);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .glass-badge h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #aaffff, #88aaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .glass-badge p {
            margin: 0;
            font-size: 0.6rem;
            color: #8899cc;
        }
        
        /* Модальное окно — элегантное */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(0,0,0,0.9), rgba(5,8,20,0.98));
            backdrop-filter: blur(28px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        
        .modal-container {
            background: linear-gradient(145deg, rgba(12, 22, 48, 0.98), rgba(5, 8, 22, 0.98));
            border-radius: 48px;
            width: 90%;
            max-width: 560px;
            border: 1px solid rgba(0, 255, 210, 0.5);
            box-shadow: 0 0 60px rgba(0, 200, 255, 0.3);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.4s ease;
        }
        
        .modal-overlay.active .modal-container {
            transform: scale(1) translateY(0);
        }
        
        .modal-header {
            padding: 1.3rem 2rem;
            border-bottom: 1px solid rgba(0, 255, 210, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            margin: 0;
            font-size: 1.7rem;
            background: linear-gradient(135deg, #ffdd99, #ff88aa, #88aaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .close-modal {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(0,255,210,0.6);
            font-size: 1.6rem;
            cursor: pointer;
            color: cyan;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .close-modal:hover {
            background: #ff3366;
            border-color: #ff3366;
            color: white;
            transform: rotate(90deg) scale(1.05);
        }
        
        .modal-body {
            padding: 2rem;
        }
        
        .elegant-desc {
            background: rgba(0, 20, 45, 0.6);
            padding: 1.2rem;
            border-radius: 28px;
            margin: 1rem 0;
            border-left: 4px solid #0ff;
            backdrop-filter: blur(4px);
            line-height: 1.5;
        }
        
        .btn-crystal {
            background: linear-gradient(95deg, #0a2a4a, #001d3d);
            border: 1px solid cyan;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1rem;
            color: #0ff;
            cursor: pointer;
            transition: all 0.25s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 15px;
        }
        
        .btn-crystal:hover {
            background: cyan;
            color: #000;
            box-shadow: 0 0 30px cyan;
            transform: translateY(-3px);
        }
        
        @media (max-width: 700px) {
            .modal-header h2 { font-size: 1.3rem; }
            .modal-body { padding: 1.2rem; }
            .glass-badge { padding: 5px 16px; }
            .glass-badge h1 { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
    <div class="ui-panel">
        <div class="glass-badge">
            <h1>✦ NEOVERSE ✦</h1>
            <p>three.js | node.js | hyperlearning</p>
        </div>
    </div>

    <div id="lessonModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modalTitle">Урок</h2>
                <button class="close-modal" id="closeModalBtn">✕</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
        
        // ---- 16 УРОКОВ (элегантное обучение) ----
        const LESSONS = [
            { id: 1, title: "Архитектура", desc: "Структура проекта: папки src/core, config, importmap Three.js. Создание фундамента." },
            { id: 2, title: "WebGL Рендерер", desc: "Настройка теней, антиалиасинг, обработка resize — первый шаг в 3D." },
            { id: 3, title: "SceneManager", desc: "Туман, звездное поле, модульность и плавная анимация сцены." },
            { id: 4, title: "Динамические звезды", desc: "BufferGeometry, PointsMaterial, мерцание как в глубоком космосе." },
            { id: 5, title: "Сетка и пол", desc: "GridHelper + полупрозрачная плоскость с тенями для реализма." },
            { id: 6, title: "CameraManager", desc: "Орбит контроль с инерцией, авто-вращение, адаптация под экран." },
            { id: 7, title: "LightManager", desc: "Ambient, Directional, Rim, Fill — объёмное кино-освещение." },
            { id: 8, title: "Конфигурация", desc: "Вынос параметров в отдельные файлы для гибкости проекта." },
            { id: 9, title: "ModelLoader", desc: "GLTFLoader, загрузка моделей, настройка теней, прогресс." },
            { id: 10, title: "Навигация моделей", desc: "Переключение между 3D кораблями с кнопками." },
            { id: 11, title: "UI панель", desc: "Создание интерфейса управления и статусов загрузки." },
            { id: 12, title: "Анимация вращения", desc: "Плавное вращение объекта с delta time." },
            { id: 13, title: "Конфиг моделей", desc: "Массив ships: url, scale, rotationSpeed." },
            { id: 14, title: "Интеграция модулей", desc: "Сборка класса Game из всех менеджеров." },
            { id: 15, title: "Анимационный цикл", desc: "requestAnimationFrame, обновление контролов, рендер." },
            { id: 16, title: "WebSocket MMO", desc: "Socket.io сервер, сессии, синхронизация игроков в реальном времени." }
        ];
        
        // --- СЦЕНА С КРАСИВЫМ ТУМАНОМ ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020218);
        scene.fog = new THREE.FogExp2(0x020218, 0.0045); // элегантный туман для глубины
        
        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2.5, 3.2, 12.5);
        camera.lookAt(0, 0.4, 0);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ReinhardToneMapping;
        renderer.toneMappingExposure = 1.25;
        document.body.appendChild(renderer.domElement);
        
        // Пост-эффект свечения
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.35, 0.85);
        bloomPass.threshold = 0.08;
        bloomPass.strength = 0.85;
        bloomPass.radius = 0.42;
        const effectComposer = new EffectComposer(renderer);
        effectComposer.addPass(renderScene);
        effectComposer.addPass(bloomPass);
        
        // CSS2D для текста кнопок
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        
        // --- УПРАВЛЕНИЕ КАМЕРОЙ (плавное авто-вращение) ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.07;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.85;
        controls.enableZoom = true;
        controls.enablePan = false;
        controls.zoomSpeed = 0.8;
        controls.target.set(0, 0.5, 0);
        
        // --- ПРЕМИУМ ОСВЕЩЕНИЕ (кинематографичное) ---
        const ambientLight = new THREE.AmbientLight(0x1a1a3a, 0.48);
        scene.add(ambientLight);
        
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
        keyLight.position.set(4, 6, 3.5);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.width = 1024;
        keyLight.shadow.mapSize.height = 1024;
        scene.add(keyLight);
        
        const fillWarm = new THREE.PointLight(0xffaa66, 0.55);
        fillWarm.position.set(-2, 1.5, 3);
        scene.add(fillWarm);
        
        const rimCool = new THREE.PointLight(0x66aaff, 0.7);
        rimCool.position.set(-1.5, 2.2, -4.5);
        scene.add(rimCool);
        
        const backGlow = new THREE.PointLight(0x33ccff, 0.55);
        backGlow.position.set(0, 0.8, -5.8);
        scene.add(backGlow);
        
        const accentLight = new THREE.PointLight(0xff66aa, 0.65);
        accentLight.position.set(2.2, 1.3, 2);
        scene.add(accentLight);
        
        // --- 3D ТЕКСТ ЛОГОТИПА (объёмный) ---
        // Загружаем шрифт через TextGeometry (важно: нужен JSON шрифт, используем встроенный факультет)
        // Создадим красивый текст с помощью Geometry + ExtrudeGeometry (стильный)
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1024;
        canvas.height = 256;
        ctx.fillStyle = 'rgba(0,0,0,0)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'Bold 80px "Orbitron", "Segoe UI", "Poppins"';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.fillText('NEOVERSE', canvas.width/2, canvas.height/2 + 20);
        
        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.92 });
        const logoSprite = new THREE.Sprite(spriteMat);
        logoSprite.scale.set(3.2, 0.8, 1);
        logoSprite.position.set(0, 2.2, -2.5);
        scene.add(logoSprite);
        
        // Дополнительно: светящийся ободок вокруг лого
        const glowPlaneMat = new THREE.MeshStandardMaterial({ color: 0x44aaff, emissive: 0x2288cc, emissiveIntensity: 0.5, transparent: true, opacity: 0.3, side: THREE.BackSide });
        const glowPlane = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 0.95), glowPlaneMat);
        glowPlane.position.set(0, 2.2, -2.48);
        scene.add(glowPlane);
        
        // --- ЗВЁЗДНОЕ ПОЛЕ (тонкие, изящные) ---
        const starGeo = new THREE.BufferGeometry();
        const starCount = 3500;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 420;
            starPositions[i*3+1] = (Math.random() - 0.5) * 180;
            starPositions[i*3+2] = (Math.random() - 0.5) * 160 - 70;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.06, transparent: true, opacity: 0.7 });
        const stars = new THREE.Points(starGeo, starMaterial);
        scene.add(stars);
        
        // --- ДЕКОРАТИВНЫЕ ЭЛЕМЕНТЫ (энергетические кольца) ---
        const ringGroup = new THREE.Group();
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x55aaff, emissive: 0x2277aa, emissiveIntensity: 0.45, metalness: 0.9 });
        const outerRing = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.06, 128, 400), ringMat);
        outerRing.rotation.x = Math.PI / 2;
        ringGroup.add(outerRing);
        const innerRing = new THREE.Mesh(new THREE.TorusGeometry(2.8, 0.045, 128, 400), ringMat);
        innerRing.rotation.z = Math.PI / 2.8;
        ringGroup.add(innerRing);
        scene.add(ringGroup);
        
        // Прозрачная платформа
        const platformGeo = new THREE.CylinderGeometry(2.9, 3.2, 0.1, 64);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x112244, metalness: 0.85, roughness: 0.25, transparent: true, opacity: 0.55 });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.set(0, -1.2, 0);
        platform.receiveShadow = true;
        scene.add(platform);
        
        // Микрочастицы (очень мелкие, изящные)
        const microParticles = new THREE.Group();
        const microCount = 1200;
        const microGeo = new THREE.SphereGeometry(0.022, 5, 5);
        for (let i = 0; i < microCount; i++) {
            const mat = new THREE.MeshStandardMaterial({ color: 0x88aaff, emissive: 0x3388ff, emissiveIntensity: 0.25 });
            const particle = new THREE.Mesh(microGeo, mat);
            const rad = 2.4 + Math.random() * 2.6;
            const ang = Math.random() * Math.PI * 2;
            const yOff = (Math.random() - 0.5) * 2.8;
            particle.userData = { radius: rad, angle: ang, speed: 0.0015 + Math.random() * 0.007, yOffset: yOff };
            particle.position.set(Math.cos(ang) * rad, yOff, Math.sin(ang) * rad);
            particle.castShadow = false;
            microParticles.add(particle);
        }
        scene.add(microParticles);
        
        // Центральный энергетический кристалл
        const coreMaterial = new THREE.MeshStandardMaterial({ color: 0xffaa55, emissive: 0xff4400, emissiveIntensity: 0.75, metalness: 0.95, roughness: 0.12 });
        const coreCrystal = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85, 0), coreMaterial);
        coreCrystal.position.set(0, 0.15, 0);
        coreCrystal.castShadow = true;
        scene.add(coreCrystal);
        
        // --- СОЗДАНИЕ КНОПОК-УРОКОВ (стильные кристаллы с кольцами) ---
        const lessonItems = [];
        const radiusRingItems = 3.9;
        const yBaseItems = -0.3;
        
        LESSONS.forEach((lesson, idx) => {
            const angle = (idx / LESSONS.length) * Math.PI * 2;
            const x = Math.cos(angle) * radiusRingItems;
            const z = Math.sin(angle) * radiusRingItems;
            const y = yBaseItems + Math.sin(angle * 2) * 0.5;
            
            // Геометрия: октаэдр для элегантности
            const geometry = new THREE.OctahedronGeometry(0.62);
            const material = new THREE.MeshStandardMaterial({
                color: 0x6a8ecc,
                metalness: 0.88,
                roughness: 0.23,
                emissive: 0x224466,
                emissiveIntensity: 0.42
            });
            const buttonMesh = new THREE.Mesh(geometry, material);
            buttonMesh.position.set(x, y, z);
            buttonMesh.castShadow = true;
            scene.add(buttonMesh);
            
            // Кольцо вокруг кнопки
            const ringGeo = new THREE.TorusGeometry(0.72, 0.035, 32, 64);
            const ringMatBtn = new THREE.MeshStandardMaterial({ color: 0x55ccff, emissive: 0x44aaff, emissiveIntensity: 0.55 });
            const energyRing = new THREE.Mesh(ringGeo, ringMatBtn);
            energyRing.rotation.x = Math.PI / 2;
            buttonMesh.add(energyRing);
            buttonMesh.userData = { orbitRing: energyRing };
            
            // CSS2D текст
            const div = document.createElement('div');
            div.textContent = `${lesson.id}. ${lesson.title}`;
            div.style.backgroundColor = 'rgba(0, 12, 25, 0.8)';
            div.style.color = '#eef';
            div.style.padding = '5px 14px';
            div.style.borderRadius = '40px';
            div.style.fontSize = '11px';
            div.style.fontWeight = '600';
            div.style.border = '1px solid rgba(0,255,210,0.7)';
            div.style.backdropFilter = 'blur(12px)';
            div.style.fontFamily = "'Orbitron', monospace";
            div.style.whiteSpace = 'nowrap';
            div.style.pointerEvents = 'none';
            div.style.letterSpacing = '0.5px';
            const label = new CSS2DObject(div);
            label.position.set(x, y + 0.82, z);
            scene.add(label);
            
            lessonItems.push({
                mesh: buttonMesh,
                lesson: lesson,
                originalColor: 0x6a8ecc,
                hoverColor: 0x8abaff,
                ring: energyRing
            });
        });
        
        // --- Лучи от центра (эффект голограммы) ---
        const radialRays = [];
        for (let i = 0; i < 48; i++) {
            const ang = (i / 48) * Math.PI * 2;
            const points = [
                new THREE.Vector3(0, 0.1, 0),
                new THREE.Vector3(Math.cos(ang) * 4.3, 0.1 + Math.sin(ang) * 0.25, Math.sin(ang) * 4.3)
            ];
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x44aaff, transparent: true, opacity: 0.2 });
            const rayLine = new THREE.Line(lineGeo, lineMat);
            scene.add(rayLine);
            radialRays.push(rayLine);
        }
        
        // --- МОДАЛЬНОЕ ОКНО (без прогресса) ---
        const modal = document.getElementById('lessonModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalBodyDiv = document.getElementById('modalBody');
        
        function openLesson(lesson) {
            modalTitle.innerHTML = `✦ УРОК ${lesson.id}: ${lesson.title} ✦`;
            modalBodyDiv.innerHTML = `
                <div class="elegant-desc">
                    <strong>📖 СОДЕРЖАНИЕ:</strong><br>
                    ${lesson.desc}
                </div>
                <div class="elegant-desc" style="border-left-color:#ff88aa;">
                    <strong>🎯 ЧЕМУ ВЫ НАУЧИТЕСЬ:</strong><br>
                    • Создавать модульную 3D-архитектуру<br>
                    • Применять продвинутые техники Three.js<br>
                    • Строить фундамент для мультиплеера
                </div>
                <button class="btn-crystal" id="gotoLessonBtn">🚀 ПЕРЕЙТИ К УРОКУ</button>
            `;
            modal.classList.add('active');
            document.getElementById('gotoLessonBtn').onclick = () => {
                window.open(`lesson${lesson.id}.html`, '_blank');
            };
        }
        
        document.getElementById('closeModalBtn').onclick = () => modal.classList.remove('active');
        modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };
        
        // --- RAYCASTER ДЛЯ КЛИКОВ ---
        const raycaster = new THREE.Raycaster();
        const mouseVec = new THREE.Vector2();
        
        window.addEventListener('click', (event) => {
            if (modal.classList.contains('active')) return;
            const rect = renderer.domElement.getBoundingClientRect();
            mouseVec.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouseVec.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouseVec, camera);
            const intersects = raycaster.intersectObjects(lessonItems.map(i => i.mesh));
            if (intersects.length) {
                const hit = intersects[0].object;
                const data = lessonItems.find(i => i.mesh === hit);
                if (data) {
                    openLesson(data.lesson);
                    hit.scale.set(0.92, 0.92, 0.92);
                    setTimeout(() => hit.scale.set(1, 1, 1), 130);
                }
            }
        });
        
        // Hover эффект
        let currentHover = null;
        window.addEventListener('mousemove', (event) => {
            const rect = renderer.domElement.getBoundingClientRect();
            mouseVec.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouseVec.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouseVec, camera);
            const intersects = raycaster.intersectObjects(lessonItems.map(i => i.mesh));
            if (intersects.length) {
                const hoveredMesh = intersects[0].object;
                const btn = lessonItems.find(i => i.mesh === hoveredMesh);
                if (btn && currentHover !== btn) {
                    if (currentHover) {
                        currentHover.mesh.material.color.setHex(currentHover.originalColor);
                        currentHover.mesh.material.emissiveIntensity = 0.42;
                    }
                    btn.mesh.material.color.setHex(btn.hoverColor);
                    btn.mesh.material.emissiveIntensity = 0.88;
                    currentHover = btn;
                }
            } else if (currentHover) {
                currentHover.mesh.material.color.setHex(currentHover.originalColor);
                currentHover.mesh.material.emissiveIntensity = 0.42;
                currentHover = null;
            }
        });
        
        // --- АНИМАЦИЯ ---
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            
            // Вращение кристалла и колец
            coreCrystal.rotation.y += 0.006;
            coreCrystal.rotation.x = Math.sin(time * 0.55) * 0.12;
            ringGroup.rotation.z += 0.002;
            ringGroup.rotation.y += 0.0015;
            
            // Анимация звёзд
            stars.rotation.y += 0.00015;
            starMaterial.opacity = 0.68 + Math.sin(time * 1.1) * 0.08;
            
            // Микрочастицы
            microParticles.children.forEach((part, idx) => {
                const d = part.userData;
                if (d) {
                    d.angle += d.speed;
                    part.position.x = Math.cos(d.angle) * d.radius;
                    part.position.z = Math.sin(d.angle) * d.radius;
                    part.position.y = d.yOffset + Math.sin(time * 1.0 + idx) * 0.07;
                }
            });
            
            // Вращение колец у кнопок
            lessonItems.forEach(item => {
                if (item.ring) item.ring.rotation.z += 0.018;
            });
            
            // Динамические огни
            accentLight.intensity = 0.55 + Math.sin(time * 1.5) * 0.25;
            rimCool.intensity = 0.65 + Math.sin(time * 1.2) * 0.15;
            backGlow.intensity = 0.5 + Math.sin(time * 0.9) * 0.12;
            
            controls.update();
            effectComposer.render();
            labelRenderer.render(scene, camera);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effectComposer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        console.log("✨ NEOVERSE PORTAL — стильный 3D интерфейс готов. Кликайте на кристаллы!");
    </script>
</body>
</html>
