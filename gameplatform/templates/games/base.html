{% extends 'base.html' %}

{% block extra_css %}
<style>
/* Стили для игровой платформы */
.game-card {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    transition: all 0.3s ease;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.game-card:hover {
    transform: translateY(-10px);
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}

.game-card-image {
    position: relative;
    height: 180px;
    overflow: hidden;
}

.game-card-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.game-card:hover .game-card-image img {
    transform: scale(1.05);
}

.game-card-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--primary-color);
    color: white;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    z-index: 2;
}

.game-card-premium {
    background: linear-gradient(135deg, #FFD700, #FFA500);
}

.game-card-content {
    padding: 20px;
    flex-grow: 1;
    display: flex;
    flex-direction: column;
}

.game-card-title {
    font-size: 1.2em;
    font-weight: 600;
    color: var(--dark-color);
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.game-card-description {
    color: #666;
    font-size: 0.9em;
    margin-bottom: 15px;
    flex-grow: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.game-card-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: auto;
    padding-top: 15px;
    border-top: 1px solid #f0f0f0;
}

.game-card-author {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #666;
    font-size: 0.9em;
}

.game-card-author-avatar {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--primary-color);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: bold;
}

.game-card-stats {
    display: flex;
    gap: 15px;
}

.game-card-stat {
    display: flex;
    align-items: center;
    gap: 5px;
    color: #666;
    font-size: 0.9em;
}

.game-card-stat i {
    color: var(--primary-color);
}

/* Кнопки игр */
.btn-play {
    background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.btn-play:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(76, 175, 80, 0.3);
    color: white;
}

.btn-premium {
    background: linear-gradient(135deg, #FFD700, #FFA500);
}

/* Фильтры и поиск */
.game-filters {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    margin-bottom: 30px;
}

.filter-group {
    margin-bottom: 20px;
}

.filter-group:last-child {
    margin-bottom: 0;
}

.filter-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: var(--dark-color);
}

/* Пагинация */
.pagination {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 40px;
}

.page-item {
    list-style: none;
}

.page-link {
    display: block;
    padding: 10px 15px;
    background: white;
    border: 2px solid #f0f0f0;
    border-radius: 8px;
    color: var(--dark-color);
    text-decoration: none;
    transition: all 0.3s ease;
}

.page-link:hover {
    border-color: var(--primary-color);
    color: var(--primary-color);
}

.page-item.active .page-link {
    background: var(--primary-color);
    border-color: var(--primary-color);
    color: white;
}

/* Категории */
.category-badge {
    display: inline-block;
    padding: 8px 15px;
    background: var(--light-color);
    border-radius: 25px;
    color: var(--dark-color);
    text-decoration: none;
    transition: all 0.3s ease;
    margin-bottom: 10px;
    margin-right: 10px;
}

.category-badge:hover {
    background: var(--primary-color);
    color: white;
}

.category-badge.active {
    background: var(--primary-color);
    color: white;
}

/* Иконки категорий */
.category-icon {
    font-size: 1.2em;
    margin-right: 8px;
}

/* Адаптивность для игр */
@media (max-width: 768px) {
    .game-card-image {
        height: 150px;
    }

    .game-filters {
        padding: 15px;
    }

    .game-card-stat {
        font-size: 0.8em;
    }
}
</style>
{% endblock %}
